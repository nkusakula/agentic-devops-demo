name: CI - Build and Test

on:
  push:
    branches: [main, develop, iac]
  pull_request:
    branches: [main]

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Validate backend port alignment (app vs IaC)
        run: |
          APP_PORT=$(awk '
            /^server:/ { in_server=1; next }
            in_server && /^[^[:space:]]/ { in_server=0 }
            in_server && $1=="port:" { print $2; exit }
          ' backend/src/main/resources/application.yml)

          IAC_PORT=$(sed -nE 's/^[[:space:]]*backend_port[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' infra/terraform/main.tf | head -n 1)

          if [ -z "$APP_PORT" ] || [ -z "$IAC_PORT" ]; then
            echo "Unable to read backend app port or IaC backend_port value."
            exit 1
          fi

          if [ "$APP_PORT" != "$IAC_PORT" ]; then
            echo "Port mismatch: backend application.yml server.port=$APP_PORT but infra local.backend_port=$IAC_PORT"
            exit 1
          fi

          BACKEND_BLOCK=$(awk '
            /resource "azurerm_container_app" "backend" {/ { in_backend=1 }
            /resource "azurerm_container_app" "frontend" {/ { in_backend=0 }
            in_backend { print }
          ' infra/terraform/main.tf)

          for REQUIRED in \
            "target_port                = local.backend_port" \
            "readiness_probe" \
            "startup_probe" \
            "liveness_probe" \
            "port      = local.backend_port"
          do
            if ! printf '%s\n' "$BACKEND_BLOCK" | grep -Fq "$REQUIRED"; then
              echo "Missing backend IaC port guard requirement: $REQUIRED"
              exit 1
            fi
          done

      - name: Build with Maven
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Run tests
        run: |
          cd backend
          mvn test

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright
        run: |
          cd tests
          npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd tests && npx playwright install --with-deps chromium

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd tests && npx playwright install-deps chromium

      - name: Run Playwright tests
        run: |
          cd tests
          npx playwright test --project chromium

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: tests/test-results
          retention-days: 7
