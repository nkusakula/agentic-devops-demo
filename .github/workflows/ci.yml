name: CI - Build and Test

on:
  push:
    branches: [main, develop, iac]
  pull_request:
    branches: [main]

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Validate backend port alignment (app vs IaC)
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          app_text = pathlib.Path("backend/src/main/resources/application.yml").read_text()
          tf_text = pathlib.Path("infra/terraform/main.tf").read_text()

          server_block = re.search(r"(?ms)^server:\s*\n((?:^[ \t].*\n?)*)", app_text)
          app_port_match = re.search(r"(?m)^\s*port:\s*(\d+)\s*(?:#.*)?$", server_block.group(1) if server_block else "")
          locals_block = re.search(r"(?ms)^locals\s*\{(.*?)^\}", tf_text)
          iac_port_match = re.search(r"(?m)^\s*backend_port\s*=\s*(\d+)\s*$", locals_block.group(1) if locals_block else "")

          if not app_port_match or not iac_port_match:
            print("Unable to read backend application.yml server.port or infra local.backend_port.")
            sys.exit(1)

          app_port = app_port_match.group(1)
          iac_port = iac_port_match.group(1)

          if app_port != iac_port:
            print(f"Port mismatch: backend application.yml server.port={app_port} but infra local.backend_port={iac_port}")
            sys.exit(1)

          resource_start = tf_text.find('resource "azurerm_container_app" "backend" {')
          if resource_start == -1:
            print("Backend container app resource block not found in infra/terraform/main.tf")
            sys.exit(1)

          block_start = tf_text.find("{", resource_start)
          depth = 0
          end = None
          for idx in range(block_start, len(tf_text)):
            char = tf_text[idx]
            if char == "{":
              depth += 1
            elif char == "}":
              depth -= 1
              if depth == 0:
                end = idx + 1
                break

          if end is None:
            print("Could not parse backend container app resource block in infra/terraform/main.tf")
            sys.exit(1)

          backend_block = tf_text[resource_start:end]
          required_patterns = {
            "target_port uses local.backend_port": r"(?m)^\s*target_port\s*=\s*local\.backend_port\s*$",
            "readiness_probe uses local.backend_port": r"(?ms)readiness_probe\s*\{.*?\bport\s*=\s*local\.backend_port\b",
            "startup_probe uses local.backend_port": r"(?ms)startup_probe\s*\{.*?\bport\s*=\s*local\.backend_port\b",
            "liveness_probe uses local.backend_port": r"(?ms)liveness_probe\s*\{.*?\bport\s*=\s*local\.backend_port\b",
          }

          for label, pattern in required_patterns.items():
            if not re.search(pattern, backend_block):
              print(f"Missing backend IaC port guard requirement: {label}")
              sys.exit(1)

          print(f"Backend port alignment validated successfully (port {app_port}).")
          PY

      - name: Build with Maven
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Run tests
        run: |
          cd backend
          mvn test

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright
        run: |
          cd tests
          npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd tests && npx playwright install --with-deps chromium

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd tests && npx playwright install-deps chromium

      - name: Run Playwright tests
        run: |
          cd tests
          npx playwright test --project chromium

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: tests/test-results
          retention-days: 7
