name: CI - Build and Test

on:
  push:
    branches: [main, develop, iac]
  pull_request:
    branches: [main]

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Validate backend port alignment (app vs IaC)
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          app_text = pathlib.Path("backend/src/main/resources/application.yml").read_text()
          tf_text = pathlib.Path("infra/terraform/main.tf").read_text()

          def extract_brace_block(text: str, marker: str) -> str | None:
            start = text.find(marker)
            if start == -1:
              return None
            block_start = text.find("{", start)
            depth = 0
            for idx in range(block_start, len(text)):
              char = text[idx]
              if char == "{":
                depth += 1
              elif char == "}":
                depth -= 1
                if depth == 0:
                  return text[start:idx + 1]
            return None

          server_block = re.search(r"(?ms)^[ \t]*server:\s*\n((?:[ \t]+.*\n?)*)", app_text)
          app_port_match = re.search(r"(?m)^\s*port:\s*(\d+)\s*(?:#.*)?$", server_block.group(1) if server_block else "")
          locals_block = extract_brace_block(tf_text, "locals {")
          iac_port_match = re.search(r"(?m)^\s*backend_port\s*=\s*(\d+)\s*$", locals_block if locals_block else "")

          if not app_port_match or not iac_port_match:
            print(
              "Backend port extraction failed: "
              f"application.yml server.port found={bool(app_port_match)}, "
              f"terraform local.backend_port found={bool(iac_port_match)}"
            )
            sys.exit(1)

          app_port = app_port_match.group(1)
          iac_port = iac_port_match.group(1)

          if app_port != iac_port:
            print(f"Port mismatch: backend application.yml server.port={app_port} but infra local.backend_port={iac_port}")
            sys.exit(1)

          backend_block = extract_brace_block(tf_text, 'resource "azurerm_container_app" "backend" {')
          if backend_block is None:
            print("Backend container app resource block not found in infra/terraform/main.tf")
            sys.exit(1)

          if not re.search(r"(?m)^\s*target_port\s*=\s*local\.backend_port\s*$", backend_block):
            print("Missing backend IaC port guard requirement: target_port uses local.backend_port")
            sys.exit(1)

          for probe_name in ("readiness_probe", "startup_probe", "liveness_probe"):
            probe_block = extract_brace_block(backend_block, f"{probe_name} {{")
            if probe_block is None:
              print(f"Missing backend IaC port guard requirement: {probe_name} block not found")
              sys.exit(1)
            if not re.search(r"(?m)^\s*port\s*=\s*local\.backend_port\s*$", probe_block):
              print(f"Missing backend IaC port guard requirement: {probe_name} port uses local.backend_port")
              sys.exit(1)

          print(f"Backend port alignment validated successfully (port {app_port}).")
          PY

      - name: Build with Maven
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Run tests
        run: |
          cd backend
          mvn test

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright
        run: |
          cd tests
          npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd tests && npx playwright install --with-deps chromium

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd tests && npx playwright install-deps chromium

      - name: Run Playwright tests
        run: |
          cd tests
          npx playwright test --project chromium

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: tests/test-results
          retention-days: 7
