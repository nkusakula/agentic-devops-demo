api_version: azuresre.ai/v1
kind: ScheduledTask
spec:
  name: three-rivers-config-drift
  description: Check for configuration drift in the Three Rivers Bank deployment every 6 hours
  cronExpression: "0 */6 * * *"
  agent: ""
  agentPrompt: |
    Check for configuration drift in the Three Rivers Bank deployment:

    1. Resolve the backend and frontend Container Apps by the tags
       application=three-rivers-bank and azd-service-name={backend,frontend}.

    2. Verify backend environment variables match expected values:
       - BIAN_API_BASE_URL: https://virtserver.swaggerhub.com/B154/BIAN/CreditCard/13.0.0
       - SPRING_PROFILES_ACTIVE: production
       - SPRING_H2_CONSOLE_ENABLED: false
       - CORS_ALLOWED_ORIGINS includes the current frontend ingress FQDN.

    3. Verify container resource limits:
       - Backend: 0.5 vCPU, 1Gi memory, minimum 2 replicas, maximum 3 replicas.
       - Frontend: 0.25 vCPU, 0.5Gi memory, minimum 1 replica, maximum 3 replicas.

    4. Verify deployment revision and image consistency for both apps:
       - properties.latestRevisionName equals properties.latestReadyRevisionName.
       - Exactly one revision is active with 100 percent traffic.
       - The active revision image equals the app template image.

    5. Query Container App WRITE activity for the previous 7 days. Filter
       server-side by operation name before evaluating results; unfiltered
       output can be truncated by high-volume getAuthtoken actions:
       ```bash
       az monitor activity-log list --resource-id <backendResourceId> --offset 7d \
         --query "[?contains(operationName.value, 'write')]" -o json
       az monitor activity-log list --resource-id <frontendResourceId> --offset 7d \
         --query "[?contains(operationName.value, 'write')]" -o json
       ```
       Treat a successful write as potential drift unless it is attributable to
       the expected deployment process. Record timestamp, caller, correlation
       ID, resource, and changed property where available.

    6. If drift is detected, use the incident-handler subagent to create a
       GitHub issue. Include expected and observed values, affected resource,
       active revision and image, relevant activity-log evidence, impact, and
       a minimal recommended remediation. If no drift is detected, report the
       checks and time window used.
