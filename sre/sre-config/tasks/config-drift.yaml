api_version: azuresre.ai/v1
kind: ScheduledTask
spec:
  name: three-rivers-config-drift
  description: Check for configuration drift in the Three Rivers Bank deployment every 6 hours
  cronExpression: "0 */6 * * *"
  agent: ""
  agentPrompt: |
    Check configuration drift: compare live settings with the values below, then create a GitHub issue only when a mismatch is confirmed. Record current-versus-expected values and a remediation for each confirmed mismatch. Do not report secrets.

    1. Verify backend environment values:
       - BIAN_API_BASE_URL: https://virtserver.swaggerhub.com/B154/BIAN/CreditCard/13.0.0
       - SPRING_PROFILES_ACTIVE: production
       - SPRING_H2_CONSOLE_ENABLED: false

    2. Verify container resource limits:
       - Backend: 0.5 vCPU, 1Gi memory
       - Frontend: 0.25 vCPU, 0.5Gi memory

    3. Verify deployed images:
       - For each app, identify the active revision receiving 100% traffic and its image tag.
       - Compare it with the newest ACR tag, ordered by time, in that app's own repository.
       - Flag image drift only when the active tag differs from that repository's newest tag. Backend and frontend releases may occur at different times.

    4. Review write operations for the resource group during the previous six hours. Ignore getAuthtoken/action events because they do not change configuration.

    5. If drift is confirmed, use the incident-handler subagent to create a GitHub issue. Include resource IDs, current and expected values, evidence, and recommended remediation. Do not create an issue when no drift is found.
