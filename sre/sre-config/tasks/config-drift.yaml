api_version: azuresre.ai/v1
kind: ScheduledTask
spec:
  name: three-rivers-config-drift
  description: Check for configuration drift in the Three Rivers Bank deployment every 6 hours
  cronExpression: "0 */6 * * *"
  agent: ""
  agentPrompt: |
    Check for configuration drift in the Three Rivers Bank deployment:

    1. Verify environment variables match expected values:
       - BIAN_API_BASE_URL should be: https://virtserver.swaggerhub.com/B154/BIAN/CreditCard/13.0.0
       - SPRING_PROFILES_ACTIVE should be: production
       - SPRING_H2_CONSOLE_ENABLED should be: false

    2. Verify container resource limits:
       - Backend: 0.5 vCPU, 1GB memory
       - Frontend: 0.25 vCPU, 0.5GB memory

    3. For each app, record its configured image and the image, creation time,
       and traffic weight of its active revision. Compare the image tag or digest
       with the latest successful deployment record that names the deployed
       artifact for this environment and app. A newest registry tag or workflow
       commit alone does not prove which image was deployed. If registry access
       is denied, do not retry with the same identity; inspect successful runs
       of .github/workflows/cd.yml or deployment records for an artifact-level
       baseline. Verify the run targeted this environment, named the exact
       deployed image, and finished before the serving revision was created.
       If no such baseline can be read, report the serving image and mark the
       deployment-version comparison unverified, not drift.

    4. Compare runtime settings with infra/terraform/main.tf and azure.yaml.
       LOGGING_LEVEL_COM_THREERIVERSBANK=INFO is declared in azure.yaml.
       MANAGEMENT_ENDPOINT_HEALTH_ENABLED=true and
       MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info are set by the
       health-check-disabled rollback in sre/scripts/chaos-engineering.sh.
       If still present but absent from IaC, report only a low-risk
       source-of-truth gap; do not call it an outage or unexplained drift.

    5. For a confirmed mismatch, check equivalent open GitHub issues first.
       Comment with new evidence on a matching issue instead of opening a
       duplicate. Otherwise, use the incident-handler workflow to create an
       issue with source references and recommended fixes. Do not change Azure.
