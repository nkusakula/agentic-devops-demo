api_version: azuresre.ai/v1
kind: ScheduledTask
spec:
  name: three-rivers-config-drift
  description: Check for configuration drift in the Three Rivers Bank deployment every 6 hours
  cronExpression: "0 */6 * * *"
  agent: ""
  agentPrompt: |
    Check for configuration drift in the Three Rivers Bank deployment using read-only queries.
    Discover the subscription, resource group, backend and frontend apps from the
    application=three-rivers-bank and azd-service-name resource tags; do not assume
    that the CI workflow's default environment name is the deployed environment.
    Compare against infra/terraform/main.tf, variables.tf, and azure.yaml.

    1. Read each Container App's current template and verify backend environment variables:
       - BIAN_API_BASE_URL: https://virtserver.swaggerhub.com/B154/BIAN/CreditCard/13.0.0
       - SPRING_PROFILES_ACTIVE: production
       - SPRING_H2_CONSOLE_ENABLED: false
       Compare other declared settings (including frontend VITE_API_BASE_URL,
       CORS_ALLOWED_ORIGINS, ingress ports, replicas, and health probes) where
       their expected values can be resolved from the deployed environment.
       Report extra variables separately; verify their purpose against azure.yaml
       and operational scripts before classifying them as harmful drift.

    2. Verify container resources against the Terraform baseline:
       - Backend: 0.5 vCPU, 1Gi memory (unless deployment variables override defaults)
       - Frontend: 0.25 vCPU, 0.5Gi memory

    3. Check both active revisions' image references against deployment records
       when available. If records are unavailable, compare each image tag with
       the newest tag in its ACR repository and report this as a registry check,
       NOT proof that it is the latest intended deployment. Exclude placeholder
       Terraform image defaults when azd deploy supplies versioned images.

    4. Report matches, confirmed drift, and unverified checks separately, with
       the actual and expected values. Do not infer no drift from a failed query.
       If confirmed harmful drift is detected, use the incident-handler subagent
       to create a GitHub issue with evidence and recommended fixes. Do not
       change Azure configuration as part of this monitoring task.
