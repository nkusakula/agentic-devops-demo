api_version: azuresre.ai/v1
kind: ScheduledTask
spec:
  name: three-rivers-config-drift
  description: Check for configuration drift in the Three Rivers Bank deployment every 6 hours
  cronExpression: "0 */6 * * *"
  agent: ""
  agentPrompt: |
    Check for configuration drift in the Three Rivers Bank deployment:

    Scope the check to the tagged Three Rivers Bank resource group and identify
    its environment from the azd-env-name tag. Use infra/terraform/main.tf,
    variables.tf, and the actual deployment inputs as the baseline; do not
    assume the defaults in variables.tf are the deployed inputs. Read only;
    never correct drift automatically.

    1. Verify backend environment variables match expected values:
       - BIAN_API_BASE_URL should be: https://virtserver.swaggerhub.com/B154/BIAN/CreditCard/13.0.0
       - SPRING_PROFILES_ACTIVE should be: production
       - SPRING_H2_CONSOLE_ENABLED should be: false
       - Check other IaC-defined variables and security-sensitive overrides.
         Additional variables injected by azd are not drift merely because
         they are absent from Terraform.

    2. Verify container resource limits and replica bounds:
       - Backend: 0.5 vCPU, 1Gi memory, 2-3 replicas
       - Frontend: 0.25 vCPU, 0.5Gi memory, 1-3 replicas
       - Use the actual deployment inputs if they override these IaC defaults.
       - Compare ingress, health probes, and logging to IaC when available.

    3. Check each running container image against the latest successful
       deployment for THIS environment. Correlate deployment records with
       active revisions and image tags/digests. ACR's newest tag alone does
       not prove which image a release intended. If no deployment record can
       be correlated, report image drift as unverified, not confirmed.

    4. If drift is confirmed, use the incident-handler subagent to create a
       GitHub issue with expected and observed values, affected resource IDs,
       evidence, and recommended fixes. Otherwise report the verified matches
       and any unverified checks; do not claim no drift for unchecked settings.
