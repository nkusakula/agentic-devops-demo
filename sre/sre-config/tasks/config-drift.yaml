api_version: azuresre.ai/v1
kind: ScheduledTask
spec:
  name: three-rivers-config-drift
  description: Check for configuration drift in the Three Rivers Bank deployment every 6 hours
  cronExpression: "0 */6 * * *"
  agent: ""
  agentPrompt: |
    Check for configuration drift in the Three Rivers Bank deployment:

    1. Verify environment variables match expected values:
       - BIAN_API_BASE_URL should be: https://virtserver.swaggerhub.com/B154/BIAN/CreditCard/13.0.0
       - SPRING_PROFILES_ACTIVE should be: production
       - SPRING_H2_CONSOLE_ENABLED should be: false

    2. Verify container resource limits:
       - Backend: 0.5 vCPU, 1GB memory
       - Frontend: 0.25 vCPU, 0.5GB memory

    3. Verify container image versions match the newest tag in the Azure Container
       Registry, checked per repository (backend and frontend separately):
       - Compare each container app's active image tag against the newest tag
         available in that repository
       - Report a mismatch only when the active tag is older than the newest tag

    4. Review write operations on the application resource group over the last
       6 hours:
       - List Azure Activity Log write operations for the resource group
       - Exclude routine `getAuthtoken/action` entries
       - Correlate any remaining write operations with the differences found above

    5. Only if a mismatch is confirmed by the evidence gathered in steps 1-4,
       use the incident-handler subagent to create a GitHub issue with the
       details and recommended fixes. If every check matches the expected
       configuration, report "no drift detected" and do not create an issue.
