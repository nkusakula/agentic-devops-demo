api_version: azuresre.ai/v1
kind: ScheduledTask
spec:
  name: three-rivers-config-drift
  description: Check for configuration drift in the Three Rivers Bank deployment every 6 hours
  cronExpression: "0 */6 * * *"
  agent: ""
  agentPrompt: |
    Check configuration drift for the Three Rivers Bank backend and frontend
    Container Apps in the application resource group. Discover the app resource
    group and match the azd-service-name tags; use the deployed Terraform
    configuration for this environment as the baseline, not generic examples.

    1. Verify backend environment variables match expected values:
       - BIAN_API_BASE_URL: https://virtserver.swaggerhub.com/B154/BIAN/CreditCard/13.0.0
       - SPRING_PROFILES_ACTIVE: production
       - SPRING_H2_CONSOLE_ENABLED: false
       Also compare other declared environment variables and dynamic URLs with
       Terraform/azure.yaml. Distinguish intentional runtime overrides from
       confirmed drift; do not print secrets.

    2. Verify container CPU and memory in the active revision:
       - Backend: 0.5 vCPU, 1Gi memory
       - Frontend: 0.25 vCPU, 0.5Gi memory
       Compare replica limits, ingress and frontend API URL with Terraform.

    3. Compare active image references with the most recent successful
       deployment for each service. Cross-check active revisions and ACR tag
       timestamps; a newer pushed tag alone does not prove it was deployed.
       If deployment provenance is unavailable, report image drift as
       unverified rather than inferring it from a tag name.

    4. Report expected versus actual for any differences. If confirmed drift
       exists, ask the incident-handler subagent to update an existing matching
       GitHub issue or create one with evidence and recommended fixes. If no
       drift is confirmed, do not create an issue. Do not change live resources.
