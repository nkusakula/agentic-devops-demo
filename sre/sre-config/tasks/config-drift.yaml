api_version: azuresre.ai/v1
kind: ScheduledTask
spec:
  name: three-rivers-config-drift
  description: Check for configuration drift in the Three Rivers Bank deployment every 6 hours
  cronExpression: "0 */6 * * *"
  agent: ""
  agentPrompt: |
    Check for configuration drift in the Three Rivers Bank deployment:

    1. Verify environment variables match expected values:
       - BIAN_API_BASE_URL should be: https://virtserver.swaggerhub.com/B154/BIAN/CreditCard/13.0.0
       - SPRING_PROFILES_ACTIVE should be: production
       - SPRING_H2_CONSOLE_ENABLED should be: false

    2. Compare the complete non-secret runtime environment-variable set against
       infra/terraform/main.tf and azure.yaml. Flag a variable as drift when it
       is present at runtime but not declared in either source, or when its value
       conflicts with its declaration. Exclude only platform-injected variables
       that are explicitly documented as exceptions.

    3. Verify container resource limits:
       - Backend: 0.5 vCPU, 1GB memory
       - Frontend: 0.25 vCPU, 0.5GB memory

    4. Check container image versions match latest deployment

    5. If drift is detected, use the incident-handler subagent to create a
       GitHub issue with details and recommended fixes.
