api_version: azuresre.ai/v1
kind: ScheduledTask
spec:
  name: three-rivers-health-check
  description: Comprehensive health check of the Three Rivers Bank application every 30 minutes
  cronExpression: "*/30 * * * *"
  agent: ""
  agentPrompt: |
    Perform a read-only, 30-minute health check of the Three Rivers Bank
    backend and frontend Container Apps. Timestamp all results in UTC. Discover
    the current app FQDNs and resource IDs rather than relying on saved ones.

    1. Backend (ca-three-rivers-demo-backend):
       - GET the public /actuator/health and /api/cards endpoints. Check that
         health is UP (including db and readiness) and the catalog has data.
       - Confirm active revision, ready replicas, traffic allocation and
         provisioning state. Independently probe HTTPS if a health validator
         says EndpointReachable=False; do not call it an outage on that flag alone.
       - Alert on any restart in the last 15 minutes. RestartCount is cumulative
         per replica: compare samples for the same pod, not the absolute value.
       - Split Azure Requests by statusCodeCategory for the last 30 minutes;
         report counts and 2xx / all responses. Flag a rate below 95%,
         including the actual status code, route and caller when available.
         Low-volume 404s alone do not prove a catalog outage. Do not attribute
         a historical 404 to / merely because a separate GET / returns 404.
       - Check CPU and memory utilization and response-time p95 (alert if > 2s).
         ResponseTime is an average, not p95: use request-level telemetry for
         p95 or explicitly report p95 unavailable; never substitute an average.

    2. Frontend (ca-three-rivers-demo-frontend):
       - GET the public root page. Check the active revision, ready replicas,
         restarts, HTTP error counts, CPU and memory as above.
       - GET the backend catalog and test a frontend-origin CORS preflight
         against /api/cards. These probes check the browser API path but do
         not prove that a full browser session succeeded.

    3. Infrastructure and evidence:
       - Check Container App Environment, Log Analytics workspace and Container
         Registry provisioning states. Successfully query current workspace
         console logs; registry provisioning alone does not prove image pulls.
       - Sample raw logs first, then filter by actual app name and observed
         format. Confirm a log source has rows before interpreting zero errors.
         If HTTP request logs are absent, say the 4xx path/caller is unknown.
       - Correlate any failures with system logs, deployments/activity and
         source code. Separate verified impact from hypotheses and monitor noise.

    4. If a failure or threshold breach is found:
       - Use code-analyzer to investigate relevant code and recent changes.
       - For a confirmed issue with evidence-based root cause and impact,
         use incident-handler to create a GitHub issue with the RCA.
       - If correlation or root cause is unavailable, report the precise
         unresolved signal and missing telemetry; do not invent an RCA or
         create an outage issue from a validator flag or isolated 404 alone.
       - Report each threshold, sample window and any check that could not be
         measured. Do not modify production as part of this health check.
