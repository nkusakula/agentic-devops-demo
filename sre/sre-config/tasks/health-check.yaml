api_version: azuresre.ai/v1
kind: ScheduledTask
spec:
  name: three-rivers-health-check
  description: Comprehensive health check of the Three Rivers Bank application every 30 minutes
  cronExpression: "*/30 * * * *"
  agent: ""
  agentPrompt: |
    Perform a comprehensive health check of the Three Rivers Bank application:

    1. Check the backend container app health:
       - GET the public HTTPS /actuator/health endpoint; require HTTP 200 and overall UP, including database and readiness. If the platform endpoint validator disagrees, trust neither alone: compare the direct probe, replicas, and logs before declaring an outage.
       - Check per-replica RestartCount deltas over the last 15 minutes (the metric is cumulative); alert if any replica actually restarted.
       - Compute HTTP 2xx / all Requests from statusCodeCategory over the last 30 minutes. Report numerator, denominator, and 4xx/5xx breakdown. Investigate results below 95%, but treat isolated 4xx in a low-volume sample as inconclusive until the route/caller or user impact is established.
       - Check response time p95 against 2 seconds only from request-duration telemetry with enough samples. ResponseTime average/maximum is not p95; if duration telemetry is absent, report p95 as unavailable rather than passing the check.
       - Verify CPU and memory utilization against the container allocations.

    2. Check the frontend container app health:
       - GET the public HTTPS root and confirm an HTML response.
       - Check Requests by statusCodeCategory and inspect scoped Nginx access logs for 4xx/5xx; record the sample size.
       - GET backend /api/cards and confirm the expected five-card catalog. Send an OPTIONS preflight with the frontend Origin and verify the allowed origin; these checks do not prove a real browser can render the page, so label that separately.

    3. Check infrastructure health:
       - Check Container App Environment provisioning status.
       - Verify Log Analytics workspace provisioning and sample recent raw rows for both apps before trusting an empty error-filter query.
       - Check Container Registry provisioning and its public /v2/ auth challenge; a 401 Bearer challenge proves reachability, not authenticated image-pull success.

    4. If a repeatable or user-impacting issue is confirmed:
       - Use the code-analyzer subagent to check recent code changes against the active revision and deployment timeline; a later repository commit alone cannot explain an unchanged deployment.
       - Check existing issues for duplicates; use the incident-handler subagent to create a GitHub issue only for a new confirmed issue.
       - Include full root cause analysis when evidence supports it. If cause is unknown, record the evidence and missing telemetry explicitly rather than inventing an RCA.
